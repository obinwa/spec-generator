name: Deploy
on: 
  push:
    branches:
      - production
      - release/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      GCP_REGION: us-west4 
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        run: gcloud auth configure-docker us-west4-docker.pkg.dev

      - name: Install & Build App
        run: |
          npm ci
          npm run build
        working-directory: ./app

      - name: Build and Push Docker Image
        run: |
          docker build -t swagger-spec-generator .
          docker tag swagger-spec-generator us-west4-docker.pkg.dev/${{ secrets.PROJECT_ID }}/swagger-generator/swagger-generator-app:${{ github.sha }}
          docker push us-west4-docker.pkg.dev/${{ secrets.PROJECT_ID }}/swagger-generator/swagger-generator-app:${{ github.sha }}
        working-directory: ./app

      - name: Verify Docker Image
        run: |
          gcloud artifacts docker images list us-west4-docker.pkg.dev/$PROJECT_ID/swagger-generator/swagger-generator-app \
            --include-tags \
            --filter="tags=${{ github.sha }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            -var="google_api_key=${{ secrets.GOOGLE_API_KEY }}" \
            -var="project_id=${{ secrets.PROJECT_ID }}"
          sleep 60  # Wait for Cloud Run to be ready
        working-directory: ./terraform

      - name: Smoke Test Deployment
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          echo "Testing service at $SERVICE_URL"
          for i in {1..5}; do
            if curl -sSf "$SERVICE_URL/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
        working-directory: ./terraform

      - name: Check Cloud Run Logs
        if: always()
        run: |
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=swagger-generator-app" \
            --project=$PROJECT_ID \
            --limit=50

      - name: Verify Deployment
        run: echo "Deployment completed successfully"