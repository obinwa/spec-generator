name: Deploy
on:
  push:
    branches:
      - production
      - release/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      GCP_REGION: us-west4
    defaults:
      run:
        working-directory: ./app

    steps:
      # ========== SETUP ==========
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        run: |
          gcloud auth configure-docker $GCP_REGION-docker.pkg.dev
          gcloud config set project $PROJECT_ID

      # ========== BUILD ==========
      - name: Install & Build App
        run: |
          npm ci
          npm run build

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t swagger-spec-generator .
          docker tag swagger-spec-generator $GCP_REGION-docker.pkg.dev/$PROJECT_ID/swagger-generator/swagger-generator-app:$IMAGE_TAG
          docker push $GCP_REGION-docker.pkg.dev/$PROJECT_ID/swagger-generator/swagger-generator-app:$IMAGE_TAG

      - name: Verify Docker Image
        run: |
          gcloud artifacts docker images list $GCP_REGION-docker.pkg.dev/$PROJECT_ID/swagger-generator/swagger-generator-app \
            --include-tags \
            --filter="tags=$IMAGE_TAG"

      # ========== TERRAFORM ==========
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./terraform

      - name: Create tfvars file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat <<EOF > terraform.tfvars
          project_id = "$PROJECT_ID"
          google_api_key = "$GOOGLE_API_KEY"
          image_tag = "$IMAGE_TAG"
          region = "$GCP_REGION"
          EOF

          # Debug: Show non-sensitive vars
          echo "terraform.tfvars:"
          grep -v "google_api_key" terraform.tfvars
        working-directory: ./terraform

      - name: Terraform Apply
        timeout-minutes: 15
        run: |
          set -ex

          # Attempt state import if needed
          if ! terraform state list | grep -q "google_cloud_run_service.genkit"; then
            echo "Importing existing Cloud Run service..."
            terraform import google_cloud_run_service.genkit $GCP_REGION/$PROJECT_ID/swagger-generator-app || \
            terraform import google_cloud_run_service.genkit locations/$GCP_REGION/namespaces/$PROJECT_ID/services/swagger-generator-app || true
          fi

          terraform apply -auto-approve -input=false -lock-timeout=10m

          # Verify outputs
          terraform output -json
        working-directory: ./terraform

      # ========== VERIFICATION ==========
      - name: Smoke Test
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          echo "Testing endpoint: $SERVICE_URL/api/health"
          curl --fail --retry 10 --retry-delay 10 $SERVICE_URL/api/health
        working-directory: ./terraform

      - name: Check Cloud Run Status
        if: always()
        run: |
          gcloud run services describe swagger-generator-app \
            --region=$GCP_REGION \
            --project=$PROJECT_ID \
            --format="yaml(status, traffic, url)"