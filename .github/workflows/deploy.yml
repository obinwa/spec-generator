name: Deploy
on: 
  push:
    branches:
      - production
      - release/*

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      GCP_REGION: us-west4 
    defaults:
      run:
        working-directory: ./app  # Key change: All commands run in /app

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v1
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        
      - name: Build TypeScript
        run: npm install && npm run build
        working-directory: ./app

      # Build and push Docker image
      - run: |
          docker build -t swagger-spec-generator . || exit 1
          docker tag swagger-spec-generator us-west4-docker.pkg.dev/${{ secrets.PROJECT_ID }}/swagger-generator/swagger-generator-app:${{ github.sha }}
          docker push us-west4-docker.pkg.dev/${{ secrets.PROJECT_ID }}/swagger-generator/swagger-generator-app:${{ github.sha }} || exit 1

      # Terraform deployment
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # Disable wrapper for better GCP integration
      
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            -var="google_api_key=${{ secrets.GOOGLE_API_KEY }}" \
            -var="project_id=${{ secrets.PROJECT_ID }}"
        working-directory: ./terraform


      - name: Smoke Test Deployment
        run: |
          SERVICE_URL=$(terraform output -raw service_url -state=./terraform/terraform.tfstate)
          curl -sSf "$SERVICE_URL/health" || (echo "Health check failed"; exit 1)
              working-directory: ./terraform

      # Optional verification step
      - name: Verify Deployment
        run: |
          echo "Deployment completed successfully"
          # Add actual verification commands here if needed
          # Example: curl your-cloud-run-url/health